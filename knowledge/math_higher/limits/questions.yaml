questions:
  - id: math_higher_q_000001
    content: 设 $f(x)=\begin{cases} x+1, & x<0 \\ x^2, & x \ge 0 \end{cases}$，则 $\lim\limits_{x \to 0} f(x)$ 为
    question_type: single_choice
    difficulty: basic
    exam_level: basic
    options:
      - key: A
        content: "$0$"
      - key: B
        content: '$1$'
      - key: C
        content: 不存在
      - key: D
        content: '$+\infty$'
    answer: C
    explanation: 左极限 $\lim_{x\to 0^-} f(x)=1$，右极限 $\lim_{x\to 0^+} f(x)=0$，两侧不相等，故双侧极限不存在。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
    source_type: ai_generated
    source_reference: ai_batch_001
    solution_methods:
      - 分段点两侧分别求左右极限再比较
    common_errors:
      - error_type: concept
        description: 只代入分段点所在的一侧表达式就下结论
      - error_type: calculation
        description: 把 $x^2$ 在 $0$ 处的右极限误算为 $1$
    estimated_minutes: 3
    version: 1.0.0

  - id: math_higher_q_000002
    content: 设 $f(x)=\begin{cases} 2x+a, & x<1 \\ x^2, & x \ge 1 \end{cases}$，若 $\lim\limits_{x \to 1} f(x)$ 存在，则 $a=$
    question_type: fill_blank
    difficulty: medium
    exam_level: basic
    answer: "$-1$"
    explanation: 左极限为 $2+a$，右极限为 $1$。极限存在要求左右极限相等，故 $2+a=1$，解得 $a=-1$。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
    source_type: ai_generated
    source_reference: ai_batch_001
    solution_methods:
      - 分段点两侧求极限后令其相等解参数
    common_errors:
      - error_type: concept
        description: 直接代入 $x=1$ 到第二段表达式求参数
      - error_type: calculation
        description: 解方程时符号出错，得到 $a=1$
    estimated_minutes: 5
    version: 1.0.0
