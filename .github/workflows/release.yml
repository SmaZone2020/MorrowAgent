name: Release

# Builds the Windows installers and attaches them to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in the five files `pnpm check:version` reads;
# a mismatch stops the run before anything is compiled, because an installer
# whose filename disagrees with the version in its About page is a bug the user
# sees and we cannot patch afterwards.
#
# A manual run builds the same installers and uploads them as workflow
# artifacts without publishing a release, which is how a dry run is done.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node before pnpm: pnpm 11 needs Node >= 22.13 to start.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/checkVersion.mjs --tag "${{ github.ref_name }}"

      - name: Version strings agree
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm check:version

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # `dist/` has to exist before the crate compiles, and `tauri build` would
      # otherwise be the first thing to notice a broken frontend — after the
      # expensive Rust build.
      - name: Build the frontend
        run: pnpm build

      # These skip the tests that read `packages/` and `dist-packages/`, both of
      # which are gitignored while the content licensing is unsettled. The
      # package engine is still covered by the fixtures the tests build
      # themselves; only the shipped sample is left unverified here.
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  bundle:
    name: Windows installers
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # A tag publishes; a manual run only produces artifacts. The two are
      # separate steps rather than one action with conditional inputs, because
      # an empty `tagName` is easy to read as "publish to a release named ''".
      - name: Build and attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ format('Morrow Agent {0}', github.ref_name) }}
          releaseBody: |
            Windows installers for Morrow Agent. Both formats install the same app:

            - `.msi` — for managed machines and anyone who prefers the Windows installer service.
            - `-setup.exe` — the NSIS installer, smaller and quicker to start.

            The first release targets Windows 10/11 on x64. The build is not code-signed,
            so SmartScreen will warn on first run; choose "More info → Run anyway".

            The reference learning package is not bundled. Import a `.morrow` file from
            the shelf after the first launch.
          releaseDraft: true
          prerelease: false

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri:build

      # Kept even when a release was published, so the run page has the
      # installers without a trip through the releases tab.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: morrow-agent-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
