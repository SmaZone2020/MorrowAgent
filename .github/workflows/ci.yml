name: CI

# Everything that must be green before a change lands. The release workflow
# repeats the cheap half of this against the tag, so a broken build cannot be
# published just because CI was skipped on a tag push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node first: pnpm 11 requires Node >= 22.13 to run at all, and the
      # runner's preinstalled Node is not guaranteed to be that new.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      # `cache: pnpm` on setup-node would need pnpm on PATH before this step
      # runs, so the store is cached directly instead.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Version strings agree
        run: pnpm check:version

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  rust:
    name: Rust
    # Windows, because the app ships only Windows installers and the DPAPI
    # credential store has a Windows-only implementation. A Linux job would
    # compile the stub and prove nothing about the binary users run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # `beforeBuildCommand` is `pnpm build`, so the crate needs a `dist/` to
      # embed. Building it here also means a broken frontend fails this job
      # instead of failing later inside `tauri build`.
      - name: Build the frontend for the Tauri context
        run: pnpm build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri
