questions:
  - id: math_higher_q_000001
    content: 设 $f(x)=\begin{cases} x+1, & x<0 \\ x^2, & x \ge 0 \end{cases}$，则 $\lim\limits_{x \to 0} f(x)$ 为
    question_type: single_choice
    difficulty: basic
    difficulty_basis: 只需分别求两侧极限后比较，步骤固定，预估正确率 85% 以上。
    exam_level: basic
    options:
      - key: A
        content: "$0$"
      - key: B
        content: '$1$'
      - key: C
        content: 不存在
      - key: D
        content: '$+\infty$'
    answer: C
    explanation: 左极限 $\lim\limits_{x \to 0^-} f(x)=1$，右极限 $\lim\limits_{x \to 0^+} f(x)=0$，两侧不相等，故双侧极限不存在。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
    source_type: ai_generated
    source_reference: ai_batch_001
    solution_methods:
      - 分段点两侧分别求左右极限再比较
    common_errors:
      - error_type: concept
        description: 只代入分段点所在的一侧表达式就下结论
      - error_type: calculation
        description: 把 $x^2$ 在 $0$ 处的右极限误算为 $1$
    estimated_minutes: 3
    version: 1.0.0

  - id: math_higher_q_000002
    content: 设 $f(x)=\begin{cases} 2x+a, & x<1 \\ x^2, & x \ge 1 \end{cases}$，若 $\lim\limits_{x \to 1} f(x)$ 存在，则 $a=$
    question_type: fill_blank
    difficulty: medium
    difficulty_basis: 需要先判定极限存在的条件，再解一次一元方程，预估正确率 55%–70%。
    exam_level: basic
    answer: "$-1$"
    explanation: 左极限为 $2+a$，右极限为 $1$。极限存在要求左右极限相等，故 $2+a=1$，解得 $a=-1$。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
    source_type: ai_generated
    source_reference: ai_batch_001
    solution_methods:
      - 分段点两侧求极限后令其相等解参数
    common_errors:
      - error_type: concept
        description: 直接代入 $x=1$ 到第二段表达式求参数
      - error_type: calculation
        description: 解方程时符号出错，得到 $a=1$
    estimated_minutes: 5
    version: 1.0.0

  - id: math_higher_q_000003
    content: 设 $f(x)=\begin{cases} x\sin\frac{1}{x}, & x \ne 0 \\ a, & x=0 \end{cases}$，若 $f(x)$ 在 $x=0$ 处连续，则 $a=$
    question_type: single_choice
    difficulty: harder
    difficulty_basis: 需意识到 $\sin\frac{1}{x}$ 本身无极限，必须用 $|x\sin\frac{1}{x}| \le |x|$ 构造两侧夹逼才能求出极限，方法选择是主要门槛，预估正确率 40%–55%。
    exam_level: advanced
    options:
      - key: A
        content: "$0$"
      - key: B
        content: "$1$"
      - key: C
        content: "$-1$"
      - key: D
        content: 不存在这样的 $a$
    answer: A
    explanation: 当 $x \ne 0$ 时 $\left|\sin\frac{1}{x}\right| \le 1$，故 $0 \le \left|x\sin\frac{1}{x}\right| \le |x|$。当 $x \to 0$ 时两端都趋于 $0$，由夹逼准则得 $\lim\limits_{x \to 0}x\sin\frac{1}{x}=0$。连续要求 $a$ 等于该极限，故 $a=0$。
    knowledge_tags:
      - math_higher_limits_limit_existence
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2021_shaanxi_zsb_q01
    adaptation_note: 母本给定了分段函数，让考生判断 $x=0$ 是连续点还是哪一类间断点，函数两侧都是可直接代入的初等式；改编把分段点处的函数值换成待定参数 $a$，并把函数换成 $x\sin\frac{1}{x}$，此时 $\sin\frac{1}{x}$ 自身无极限，必须先用夹逼准则求出极限才能定 $a$，方法上比母题多一层。
    solution_methods:
      - 用 $|\sin\frac{1}{x}| \le 1$ 构造夹逼，求出极限后令其等于函数值
    common_errors:
      - error_type: method_choice
        description: 认为 $\sin\frac{1}{x}$ 在 $x \to 0$ 时无极限，据此判定 $f$ 不可能连续而无法作答
      - error_type: concept
        description: 直接把 $x=0$ 代入 $x\sin\frac{1}{x}$，没有意识到 $\frac{1}{0}$ 无意义
      - error_type: logic
        description: 只写出 $|x\sin\frac{1}{x}| \le |x|$ 就结束，没有说明两侧同趋于 $0$ 从而极限为 $0$
    estimated_minutes: 5
    version: 1.0.0

  - id: math_higher_q_000004
    content: 函数 $f(x)=\ln(x-1)+\frac{1}{x-5}$ 的定义域是
    question_type: fill_blank
    difficulty: basic
    difficulty_basis: 需分别写出真数为正与分母非零两个约束再取交集，单步运算，预估正确率 85% 以上。
    exam_level: basic
    answer: "$(1,5)\\cup(5,+\\infty)$"
    explanation: 对数要求真数为正，即 $x-1>0$，得 $x>1$；分式要求分母非零，即 $x \ne 5$。两个条件同时成立，定义域为 $x>1$ 且 $x \ne 5$，即 $(1,5)\cup(5,+\infty)$。
    knowledge_tags:
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2026_shaanxi_zsb_q01
    adaptation_note: 母本给出有理分式，要考生先找分母零点、再判断分子是否为零，从而数出间断点个数；改编改用对数与分式的组合，需同时满足真数为正与分母非零并取交集，由「计数」升级为「写出解集」，函数形式与设问均已改变。
    solution_methods:
      - 分别列出真数为正与分母非零的条件后取交集
      - 用数轴标出两个条件再求公共部分
    common_errors:
      - error_type: concept
        description: 把对数条件写成 $x-1 \ge 0$，把左端点误取为闭区间 $[1,5)$
      - error_type: logic
        description: 只满足其中一个条件就作答，漏掉 $x \ne 5$
      - error_type: expression
        description: 漏写并集符号，把答案写成 $(1,5)$ 或 $x>1$
    estimated_minutes: 3
    version: 1.0.0

  - id: math_higher_q_000005
    content: 极限 $\lim\limits_{x \to 0}\frac{|x|}{x}$ 为
    question_type: single_choice
    difficulty: medium
    difficulty_basis: 需要先去掉绝对值拆成左右两侧分别求值，再依据「左右极限相等才存在」下结论，预估正确率 55%–70%。
    exam_level: basic
    options:
      - key: A
        content: "$1$"
      - key: B
        content: "$-1$"
      - key: C
        content: 不存在
      - key: D
        content: "$0$"
    answer: C
    explanation: 当 $x>0$ 时 $\frac{|x|}{x}=1$，故右极限为 $1$；当 $x<0$ 时 $\frac{|x|}{x}=-1$，故左极限为 $-1$。两侧极限都存在但不相等，所以双侧极限不存在。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2021_shaanxi_zsb_q01
    adaptation_note: 母本是分段函数，两侧表达式不同但左右极限相等，结论为连续；改编改为含绝对值的单一表达式 $|x|$，它在 $0$ 两侧同样取不同表达式，但左右极限不相等，用相反的结论对照考查「分段形式」与「极限存在」并无必然联系。
    solution_methods:
      - 按 $x>0$ 与 $x<0$ 去绝对值后分别求左右极限
    common_errors:
      - error_type: concept
        description: 把 $|x|$ 当成 $x$ 约分，直接得到 $1$
      - error_type: logic
        description: 只算出一侧极限就断言极限存在
      - error_type: calculation
        description: 认为 $x \to 0$ 时分子分母同时趋于零所以极限为 $0$
    estimated_minutes: 3
    version: 1.0.0

  - id: math_higher_q_000006
    content: 设 $f(x)=\begin{cases} x^2, & x<1 \\ ax+b, & x \ge 1 \end{cases}$，若 $f(x)$ 在 $x=1$ 处连续，且 $f(2)=3$，则 $a$、$b$ 的值为
    question_type: fill_blank
    difficulty: medium
    difficulty_basis: 需同时列出连续性条件与函数值条件并联立求解，两个条件缺一不可，但每步都是常规运算，预估正确率 55%–70%。
    exam_level: basic
    answer: "$a=2$，$b=-1$"
    explanation: 连续性要求 $\lim\limits_{x\to 1^-}f(x)=1$ 与 $\lim\limits_{x\to 1^+}f(x)=a+b$ 相等，得 $a+b=1$；又 $f(2)=2a+b=3$。两式相减得 $a=2$，代回得 $b=-1$。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2022_shaanxi_zsb_q01
    adaptation_note: 母本只数间断点个数，是一步计数；改为给出单参数之外的第二条信息（函数值），把「左右极限相等」升级为可解方程组，增加了一次条件转化。
    solution_methods:
      - 由分段点两侧极限相等列第一个方程，再由函数值列第二个方程联立
    common_errors:
      - error_type: concept
        description: 把 $x=1$ 直接代入两段表达式求 $a$、$b$，忽略极限相等这一条件
      - error_type: calculation
        description: 解方程组时把 $2a+b=3$ 写成 $a+2b=3$
      - error_type: reading
        description: 漏读「$f(2)=3$」，只凭连续性条件就作答
    estimated_minutes: 6
    version: 1.0.0

  - id: math_higher_q_000007
    content: 计算 $\lim\limits_{x \to \infty}\frac{3x^2-x+2}{2x^2+1}$。
    question_type: calculation
    difficulty: easier
    difficulty_basis: 分子分母同除以最高次幂后逐项取极限即可，方法固定，预估正确率 70%–85%。
    exam_level: basic
    answer: "$\\frac{3}{2}$"
    explanation: 分子分母同除以 $x^2$，得 $\frac{3-\frac{1}{x}+\frac{2}{x^2}}{2+\frac{1}{x^2}}$。当 $x \to \infty$ 时含 $\frac{1}{x}$ 的项都趋于 $0$，故极限为 $\frac{3}{2}$。
    knowledge_tags:
      - math_higher_limits_limit_existence
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2026_shaanxi_zsb_q06
    adaptation_note: 母本为 $x \to 4$ 时分式有理化求极限；改编改取 $x \to \infty$ 的有理分式，把「分子分母同乘共轭式」换成「同除最高次幂并比较次数」，同一代数化简骨架、不同方法路径，避免与本章另一题重复。
    solution_methods:
      - 分子分母同除以最高次幂后逐项取极限
      - 比较分子分母次数直接读出极限
    common_errors:
      - error_type: formula_theorem
        description: 直接代入 $x=\infty$ 得到 $\frac{\infty}{\infty}$ 后随意写出结果
      - error_type: calculation
        description: 只比较二次项系数却把符号带错，得到 $-\frac{3}{2}$
    estimated_minutes: 4
    version: 1.0.0

  - id: math_higher_q_000008
    content: 计算 $\lim\limits_{x \to 0}\frac{\sqrt[3]{1+x}-1}{x}$。
    question_type: calculation
    difficulty: harder
    difficulty_basis: 需识别 $\frac{0}{0}$ 型，并选用三次根式对应的立方差公式做有理化，共轭式结构与平方根情形不同，方法选择是主要门槛，预估正确率 40%–55%。
    exam_level: advanced
    answer: "$\\frac{1}{3}$"
    explanation: 直接代入得 $\frac{0}{0}$。令 $a=\sqrt[3]{1+x}$、$b=1$，由立方差公式 $a^3-b^3=(a-b)(a^2+ab+b^2)$ 得 $a-b=\frac{a^3-b^3}{a^2+ab+b^2}=\frac{x}{\sqrt[3]{(1+x)^2}+\sqrt[3]{1+x}+1}$。故原式 $=\frac{1}{\sqrt[3]{(1+x)^2}+\sqrt[3]{1+x}+1}$，令 $x \to 0$ 得 $\frac{1}{1+1+1}=\frac{1}{3}$。
    knowledge_tags:
      - math_higher_limits_limit_existence
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2026_shaanxi_zsb_q06
    adaptation_note: 母本在 $x \to 4$ 处对含二次根式的分式做有理化，乘的是 $a+b$ 这一共轭式；改编把根式换成三次根式，共轭式随之变成 $a^2+ab+b^2$ 三项，有理化结构不同，无法照搬母题的平方差套路。
    solution_methods:
      - 用立方差公式对三次根式做有理化后约去零因子
      - 令 $t=\sqrt[3]{1+x}$ 换元，把原式化为 $\frac{t-1}{t^3-1}$ 再约分
    common_errors:
      - error_type: method_choice
        description: 只会平方差共轭式，对三次根式直接判定「无法有理化」而放弃
      - error_type: formula_theorem
        description: 把立方差公式的分母写成 $a^2+b^2$，漏掉中间项 $ab$，得到 $\frac{1}{2}$
      - error_type: calculation
        description: 代值后把 $1+1+1$ 算成 $2$，答案写成 $\frac{1}{2}$
    estimated_minutes: 6
    version: 1.0.0

  - id: math_higher_q_000009
    content: 计算 $\lim\limits_{x \to 0}(1+3x)^{\frac{1}{x}}$。
    question_type: calculation
    difficulty: medium
    difficulty_basis: 需先对幂指函数取对数化为乘积形式，再用等价无穷小 $\ln(1+3x) \sim 3x$ 求出指数极限，最后回代成 $e$ 的幂，属两步骤转化，预估正确率 55%–70%。
    exam_level: basic
    answer: "$e^3$"
    explanation: 这是 $1^{\infty}$ 型。取对数得 $\ln(1+3x)^{\frac{1}{x}}=\frac{\ln(1+3x)}{x}$，由 $\ln(1+3x) \sim 3x$ 得该式趋于 $3$。故原极限为 $e^{3}$。
    knowledge_tags:
      - math_higher_limits_limit_existence
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2023_shaanxi_zsb_q06
    adaptation_note: 母本是 $\frac{\ln(1+3x)}{2x}$ 这一显式的商式，直接配凑即可；改编把同一个对数放进幂指数，变成 $1^{\infty}$ 型，必须先取对数才能用同一个等价无穷小，最后还要回代成 $e$ 的幂，多了一层函数结构的转化。
    solution_methods:
      - 取对数化为商式后用等价无穷小求指数极限，再回代成 $e$ 的幂
      - 凑成 $\left[(1+3x)^{\frac{1}{3x}}\right]^{3}$ 后利用第二个重要极限
    common_errors:
      - error_type: formula_theorem
        description: 直接把指数 $\frac{1}{x}$ 与底数的 $3x$ 相乘得到 $3$ 后写成 $3$，忘记结果应是 $e^3$
      - error_type: concept
        description: 认为底数趋于 $1$、指数趋于无穷，故极限为 $1$
      - error_type: calculation
        description: 取对数后把 $\frac{\ln(1+3x)}{x}$ 的极限算成 $\frac{1}{3}$，得到 $e^{1/3}$
    estimated_minutes: 5
    version: 1.0.0

  - id: math_higher_q_000010
    content: 极限 $\lim\limits_{x \to 0}\frac{1-\cos 2x}{x\sin x}$ 为
    question_type: single_choice
    difficulty: medium
    difficulty_basis: 需同时把分子与分母各做一次等价替换，再约简系数，比单一替换多一步，且 $1-\cos 2x$ 的内层系数容易漏掉，预估正确率 55%–70%。
    exam_level: basic
    options:
      - key: A
        content: "$1$"
      - key: B
        content: "$2$"
      - key: C
        content: "$4$"
      - key: D
        content: "$\\frac{1}{2}$"
    answer: B
    explanation: 当 $x \to 0$ 时 $2x \to 0$，故 $1-\cos 2x \sim \frac{(2x)^2}{2}=2x^2$；又 $\sin x \sim x$。分母为 $x \cdot x = x^2$。原式等价于 $\frac{2x^2}{x^2}=2$。
    knowledge_tags:
      - math_higher_limits_limit_existence
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2022_shaanxi_zsb_q06
    adaptation_note: 母本为 $\lim\limits_{x\to 0}\frac{\sin 2x}{x}$，分子只有一处正弦、分母是单项式 $x$，做一次等价替换即可约分；改编把分子换成 $1-\cos 2x$（需用带平方的等价式并处理内层系数），分母换成两个因子之积 $x\sin x$，替换次数与结构均不同，答案也不再是简单的整数系数。
    solution_methods:
      - 分子用 $1-\cos 2x \sim 2x^2$、分母用 $\sin x \sim x$ 分别替换后约分
      - 用二倍角公式 $1-\cos 2x=2\sin^2 x$ 化归为单一正弦后约分
    common_errors:
      - error_type: formula_theorem
        description: 把 $1-\cos 2x$ 直接替换为 $2x$，得到 $\frac{2x}{x^2}$ 后无法得到有限值
      - error_type: calculation
        description: 忘记内层系数要平方，用 $1-\cos 2x \sim \frac{x^2}{2}$ 得到答案 $\frac{1}{2}$
      - error_type: concept
        description: 认为分子是二阶无穷小而分母是一阶，直接判定极限为 $0$
    estimated_minutes: 4
    version: 1.0.0

  - id: math_higher_q_000011
    content: 计算 $\lim\limits_{x \to 2}\frac{x^2-4}{x^2-3x+2}$。
    question_type: calculation
    difficulty: easier
    difficulty_basis: 分子分母各因式分解一次后约去公因子 $x-2$ 即可代值，两步都是固定套路，预估正确率 70%–85%。
    exam_level: basic
    answer: "$4$"
    explanation: 直接代入得 $\frac{0}{0}$。分子 $x^2-4=(x-2)(x+2)$，分母 $x^2-3x+2=(x-2)(x-1)$，约去公因子 $x-2$ 后原式为 $\frac{x+2}{x-1}$。令 $x \to 2$ 得 $\frac{2+2}{2-1}=4$。
    knowledge_tags:
      - math_higher_limits_limit_existence
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2024_shaanxi_zsb_q11
    adaptation_note: 母本的分子是变限积分，求极限时须先对积分上限求导、再用洛必达法则，属跨章节的综合题；改编换成纯代数分式，用因式分解约去零因子后直接代值，把考点收回到本章的「先化简再取极限」，不依赖积分与求导。
    solution_methods:
      - 分子分母分别因式分解后约去公因子再代值
    common_errors:
      - error_type: calculation
        description: 分母因式分解符号写错，分解为 $(x+2)(x+1)$，约分后无法化简
      - error_type: method_choice
        description: 直接代入得到 $\frac{0}{0}$ 后判定极限不存在
      - error_type: calculation
        description: 约分时只约掉分子或分母的一侧，留下 $\frac{x+2}{x^2-3x+2}$ 继续硬算
    estimated_minutes: 4
    version: 1.0.0

  - id: math_higher_q_000012
    content: 设 $f(x)=\begin{cases} x+1, & x<0 \\ x^2+1, & x>0 \\ 3, & x=0 \end{cases}$，则 $f(x)$ 在 $x=0$ 处
    question_type: single_choice
    difficulty: easier
    difficulty_basis: 两侧各求一次极限再与给定的函数值比较即可，但需要意识到「极限存在」不等于「连续」，预估正确率 70%–85%。
    exam_level: basic
    options:
      - key: A
        content: 连续
      - key: B
        content: 极限存在但不连续
      - key: C
        content: 极限不存在
      - key: D
        content: 极限存在且等于 $3$
    answer: B
    explanation: 左极限 $\lim\limits_{x\to 0^-}(x+1)=1$，右极限 $\lim\limits_{x\to 0^+}(x^2+1)=1$，两侧相等，故双侧极限存在且等于 $1$。但 $f(0)=3 \ne 1$，极限值不等于函数值，所以 $f(x)$ 在 $x=0$ 处不连续。
    knowledge_tags:
      - math_higher_limits_one_sided_limit
      - math_higher_limits_limit_existence
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2024_shaanxi_zsb_q01
    adaptation_note: 母本给的是有理分式，要求数出间断点个数，结论是一个计数；改编改为在单个分段点处判断连续状态，并刻意让左右极限相等而函数值另行给定，把「极限存在」与「连续」拆成两个必须分开验证的条件，结论从计数变成定性判断。
    solution_methods:
      - 分别求左右极限确认极限存在，再与 $f(0)$ 比较判断连续性
    common_errors:
      - error_type: concept
        description: 算出两侧极限相等就判定连续，漏掉与 $f(0)=3$ 的比较，选 A
      - error_type: calculation
        description: 把右极限 $0^2+1$ 算成 $0$，据此判定极限不存在，选 C
      - error_type: reading
        description: 没注意 $x=0$ 处单独给出了函数值 $3$，把极限值误当成函数值，选 D
    estimated_minutes: 3
    version: 1.0.0

  - id: math_higher_q_000013
    content: 计算 $\lim\limits_{n \to \infty}\frac{1+2+3+\cdots+n}{n^2}$。
    question_type: calculation
    difficulty: basic
    difficulty_basis: 先用等差数列求和把分子化为闭式，再按最高次幂求极限，两步都是固定套路，预估正确率 85% 以上。
    exam_level: basic
    answer: "$\\frac{1}{2}$"
    explanation: 分子是首项为 $1$、末项为 $n$ 的等差数列之和，等于 $\frac{n(n+1)}{2}$。故原式为 $\frac{n(n+1)}{2n^2}=\frac{1}{2}\left(1+\frac{1}{n}\right)$，当 $n \to \infty$ 时趋于 $\frac{1}{2}$。
    knowledge_tags:
      - math_higher_limits_limit_existence
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2021_shaanxi_zsb_q13
    adaptation_note: 母本用洛必达法则处理变限积分与幂函数之比的极限；改为先求和再求极限，同样是「先做代数化简再取极限」的骨架，但不需要积分与求导知识，符合本章边界。
    solution_methods:
      - 用等差数列求和公式化闭式后取极限
    common_errors:
      - error_type: formula_theorem
        description: 把 $1+2+\cdots+n$ 记成 $n^2$，直接得到 $1$
      - error_type: calculation
        description: 求和公式漏掉除以 $2$，得到 $1$
      - error_type: logic
        description: 逐项取极限，认为每一项 $\frac{k}{n^2}$ 都趋于 $0$，故极限为 $0$
    estimated_minutes: 4
    version: 1.0.0

  - id: math_higher_q_000014
    content: 判断：若 $\lim\limits_{x \to a^-}f(x)$ 与 $\lim\limits_{x \to a^+}f(x)$ 都存在，则 $\lim\limits_{x \to a}f(x)$ 一定存在。
    question_type: true_false
    difficulty: hard
    difficulty_basis: 需要构造反例来否定命题，而不是套用判定定理；判断正确后还要说明两侧极限相等才是充要条件，预估正确率 40% 以下。
    exam_level: challenging
    options:
      - key: A
        content: 正确
      - key: B
        content: 错误
    answer: B
    explanation: 命题缺少「两侧极限相等」这一条件。例如 $f(x)=\begin{cases} 0, & x<0 \\ 1, & x \ge 0 \end{cases}$ 在 $a=0$ 处，左极限为 $0$、右极限为 $1$，两者都存在但不相等，故双侧极限不存在，命题为假。
    knowledge_tags:
      - math_higher_limits_limit_existence
      - math_higher_limits_one_sided_limit
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2025_shaanxi_zsb_q01
    adaptation_note: 母本以具体函数让考生判断间断点个数，是计算型设问；改为对判定定理本身做真假判断，把「只验证单侧极限就断言双侧存在」这一典型错误直接做成命题，考查对充要条件的理解。
    solution_methods:
      - 举出左右极限都存在但不相等的反例
    common_errors:
      - error_type: concept
        description: 把「左右极限都存在」误当成双侧极限存在的充要条件，选「正确」
      - error_type: logic
        description: 举不出反例就默认命题成立，未意识到缺少相等条件
      - error_type: reading
        description: 把「都存在」读成「都存在且相等」，据此判定命题为真
    estimated_minutes: 4
    version: 1.0.0

  - id: math_higher_q_000015
    content: 求 $\lim\limits_{n \to \infty}\left(\frac{1}{\sqrt{n^2+1}}+\frac{1}{\sqrt{n^2+2}}+\cdots+\frac{1}{\sqrt{n^2+n}}\right)$。
    question_type: calculation
    difficulty: harder
    difficulty_basis: 需自行构造两侧同形的放缩并把项数 $n$ 一并纳入估计，方法选择与放缩技巧同时构成门槛，预估正确率 40%–55%。
    exam_level: advanced
    answer: "$1$"
    explanation: 记 $S_n=\sum\limits_{k=1}^{n}\frac{1}{\sqrt{n^2+k}}$。和式共 $n$ 项，每项的分母介于 $\sqrt{n^2+1}$ 与 $\sqrt{n^2+n}$ 之间，故每项都不小于 $\frac{1}{\sqrt{n^2+n}}$、不大于 $\frac{1}{\sqrt{n^2+1}}$。于是 $\frac{n}{\sqrt{n^2+n}} \le S_n \le \frac{n}{\sqrt{n^2+1}}$。两端分子分母同除以 $n$，得 $\frac{1}{\sqrt{1+\frac{1}{n}}}$ 与 $\frac{1}{\sqrt{1+\frac{1}{n^2}}}$，当 $n \to \infty$ 时两者都趋于 $1$。由夹逼准则，$S_n \to 1$。
    knowledge_tags:
      - math_higher_limits_limit_existence
      - math_higher_limits_function_concept
    source_type: adapted_exam
    source_exam_id: math_higher_exam_2021_shaanxi_zsb_q13
    adaptation_note: 母本是变限积分与幂函数之比的极限，用洛必达法则加等价无穷小直接算值；改编改为 $n$ 项和，不能逐项取极限，必须先构造同形的上下界再用夹逼准则判定，方法路径与母题完全不同，也不依赖积分知识。
    solution_methods:
      - 对 $n$ 项和统一放大与缩小，再用夹逼准则
    common_errors:
      - error_type: method_choice
        description: 逐项取极限，认为每一项都趋于 $0$，故和趋于 $0$
      - error_type: logic
        description: 只算出一侧放缩就下结论，没有说明另一端极限相同
      - error_type: calculation
        description: 放缩时把项数 $n$ 漏掉，把和式直接当作单项处理
    estimated_minutes: 6
    version: 1.0.0
