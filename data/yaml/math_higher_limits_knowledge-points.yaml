chapter:
  id: math_higher_limits
  name: 函数与极限
  subject_id: math_higher
  version: 1.1.0
  knowledge_points:
    - id: math_higher_limits_function_concept
      name: 函数的概念
      subject_id: math_higher
      chapter_id: math_higher_limits
      description: 函数是从定义域到值域的对应关系，给定自变量有唯一因变量与之对应；研究极限前需先明确定义域与对应法则。
      difficulty_basis: 只需理解定义与直接套用，不依赖其他知识点。
      learning_objectives:
        - 能判断给定对应关系是否为函数
        - 能求出简单函数的定义域与值域
      prerequisites: []
      related_points:
        - math_higher_limits_one_sided_limit
      difficulty: basic
      exam_importance: medium
      exam_levels:
        - score_free
      common_errors:
        - 忽略分母不为零的限制条件
        - 把多值对应误认为函数
      sources:
        - type: textbook
          reference: 同济大学《高等数学》第七版 第一章
          license: unclear
      version: 1.0.0

    - id: math_higher_limits_one_sided_limit
      name: 左右极限
      subject_id: math_higher
      chapter_id: math_higher_limits
      description: 函数在一点的左极限与右极限分别描述自变量从该点左侧与右侧趋近时函数值的趋向。
      difficulty_basis: 依赖函数概念，需要区分两侧表达式并做一次比较，属单步转化。
      learning_objectives:
        - 能写出左极限与右极限的记号并解释其含义
        - 能用左右极限判断双侧极限是否存在
      prerequisites:
        - math_higher_limits_function_concept
      related_points:
        - math_higher_limits_limit_existence
      difficulty: medium
      exam_importance: high
      exam_levels:
        - basic
        - advanced
      common_errors:
        - 忽略分段点两侧表达式不同，直接用同一侧代入
        - 误以为左极限等于右极限只是习惯约定
      sources:
        - type: textbook
          reference: 同济大学《高等数学》第七版 第一章
          license: unclear
      version: 1.0.0

    - id: math_higher_limits_limit_existence
      name: 极限存在的判定
      subject_id: math_higher
      chapter_id: math_higher_limits
      description: 双侧极限存在的充要条件是左右极限都存在且相等；夹逼准则与单调有界准则给出不需要求出极限值也能判定存在的途径。
      difficulty_basis: 依赖左右极限与函数概念，需要在夹逼准则与单调有界准则之间选择方法，属多知识点联用。
      learning_objectives:
        - 能用左右极限相等判定双侧极限存在
        - 能用夹逼准则判定极限存在并求值
      prerequisites:
        - math_higher_limits_one_sided_limit
      related_points:
        - math_higher_limits_function_concept
      difficulty: medium
      exam_importance: critical
      exam_levels:
        - basic
        - advanced
        - challenging
      common_errors:
        - 只验证单侧极限就断言双侧极限存在
        - 使用夹逼准则时放缩方向不一致
      sources:
        - type: textbook
          reference: 同济大学《高等数学》第七版 第一章
          license: unclear
      version: 1.0.0
